
version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rfms
      POSTGRES_PASSWORD: rfms
      POSTGRES_DB: rfms
    ports: ["5432:5432"]
  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  api:
    build: ./api
    environment:
      POSTGRES_DSN: postgresql+psycopg2://rfms:rfms@postgres:5432/rfms
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379/0
      REGION: region-a
    volumes: ["./common:/app/common"]
    depends_on: [postgres, minio, redis]
    ports: ["8000:8000"]
  worker:
    build: ./worker
    environment:
      POSTGRES_DSN: postgresql+psycopg2://rfms:rfms@postgres:5432/rfms
      S3_ENDPOINT: http://minio:9000
      REDIS_URL: redis://redis:6379/0
    volumes: ["./common:/app/common","./api:/app/api"]
    depends_on: [postgres, minio, redis]
